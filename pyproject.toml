[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-statements"
version = "0.1.0"
description = "Credit card statement pipeline: Gmail → PDF → structured data → DuckDB"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Claude", email = "solondas96@gmail.com"}]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pikepdf>=9.0.0",
    "pdfplumber>=0.10.0",
    "pydantic>=2.0.0",
    "duckdb>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "httpx>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "reportlab>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ccstmt = "ccstmt.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccstmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
